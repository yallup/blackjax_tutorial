[project]
name = "blackjax-tutorial"
version = "0.1.0"
description = "A general-audience tutorial for composable Bayesian inference with BlackJAX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "blackjax>=1.6",
    "distrax>=0.1.5",
    "ipykernel",
    "ipython",
    "jax",
    "matplotlib",
    "notebook",
    "numpy",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
