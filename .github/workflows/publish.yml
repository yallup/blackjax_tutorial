name: Publish the tutorial

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete lessons
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked --group book

      - name: Build and execute the MyST book
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: cd book && uv run jupyter book build --execute --html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static book
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
